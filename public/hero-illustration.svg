<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background blobs -->
  <ellipse cx="650" cy="300" rx="200" ry="180" fill="#f1f5f9" opacity="0.8"/>
  <ellipse cx="200" cy="400" rx="150" ry="120" fill="#e2e8f0" opacity="0.6"/>
  
  <!-- Connection lines -->
  <path d="M250 280 Q400 200 550 280" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 4" fill="none"/>
  <path d="M280 350 Q400 300 520 350" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" fill="none"/>
  
  <!-- Expert figure (left) -->
  <g transform="translate(180, 220)">
    <!-- Body -->
    <rect x="20" y="80" width="60" height="90" rx="8" fill="#64748b"/>
    <!-- Head -->
    <circle cx="50" cy="45" r="35" fill="#fcd9bd"/>
    <!-- Hair (grey/silver) -->
    <path d="M20 35 Q30 10 50 8 Q70 10 80 35 Q75 20 50 18 Q25 20 20 35" fill="#9ca3af"/>
    <!-- Smile -->
    <path d="M38 55 Q50 65 62 55" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="38" cy="42" r="3" fill="#475569"/>
    <circle cx="62" cy="42" r="3" fill="#475569"/>
    <!-- Briefcase -->
    <rect x="70" y="120" width="35" height="28" rx="4" fill="#475569"/>
    <rect x="80" y="115" width="15" height="8" rx="2" fill="#475569"/>
  </g>
  
  <!-- Company figure (right) -->
  <g transform="translate(520, 220)">
    <!-- Building shape -->
    <rect x="15" y="40" width="70" height="130" rx="4" fill="#334155"/>
    <!-- Windows -->
    <rect x="25" y="55" width="15" height="12" rx="2" fill="#94a3b8"/>
    <rect x="50" y="55" width="15" height="12" rx="2" fill="#94a3b8"/>
    <rect x="25" y="80" width="15" height="12" rx="2" fill="#94a3b8"/>
    <rect x="50" y="80" width="15" height="12" rx="2" fill="#94a3b8"/>
    <rect x="25" y="105" width="15" height="12" rx="2" fill="#94a3b8"/>
    <rect x="50" y="105" width="15" height="12" rx="2" fill="#94a3b8"/>
    <!-- Door -->
    <rect x="38" y="140" width="24" height="30" rx="2" fill="#64748b"/>
    <!-- Roof accent -->
    <rect x="15" y="35" width="70" height="8" rx="2" fill="#1e293b"/>
  </g>
  
  <!-- Central connection symbol -->
  <g transform="translate(360, 260)">
    <circle cx="40" cy="40" r="45" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="40" r="30" fill="#f1f5f9"/>
    <!-- Handshake icon -->
    <path d="M25 45 L35 35 L45 45 L55 35" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="48" r="6" fill="#64748b"/>
    <circle cx="50" cy="48" r="6" fill="#334155"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="150" r="8" fill="#cbd5e1"/>
  <circle cx="650" cy="450" r="6" fill="#e2e8f0"/>
  <circle cx="700" cy="150" r="10" fill="#f1f5f9"/>
  <circle cx="100" cy="500" r="5" fill="#cbd5e1"/>
  
  <!-- Small floating icons -->
  <g transform="translate(300, 150)">
    <rect width="20" height="20" rx="4" fill="#e2e8f0"/>
    <path d="M5 10 L15 10 M10 5 L10 15" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <g transform="translate(480, 420)">
    <rect width="18" height="18" rx="4" fill="#e2e8f0"/>
    <path d="M4 9 L8 13 L14 5" stroke="#64748b" stroke-width="2" fill="none"/>
  </g>
</svg>
